<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Card — 상품 상세 카드</title>
  <meta name="description" content="JSON 하나로 관리하는 상품 상세 카드 컴포넌트 (Iconly 스타일)" />

  <!-- 웹폰트 (외부 리소스는 폰트만 허용) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />

  <link rel="stylesheet" href="./css/swiper.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- ── 아이콘 스프라이트 (Iconly Light 스타일 근사 — 자체 제작) ─────── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ico-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m14.5 5.5-6.5 6.5 6.5 6.5" />
    </symbol>

    <symbol id="ico-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9.5 5.5 6.5 6.5-6.5 6.5" />
    </symbol>

    <symbol id="ico-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5.5 9.5 6.5 6.5 6.5-6.5" />
    </symbol>

    <symbol id="ico-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20.1s-7.6-4.4-9.7-9.2C.8 7.2 2.7 3.9 6.1 3.4c2-.3 3.8.6 5.9 2.9 2.1-2.3 3.9-3.2 5.9-2.9 3.4.5 5.3 3.8 3.8 7.5-2.1 4.8-9.7 9.2-9.7 9.2Z" />
    </symbol>

    <symbol id="ico-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15.5V4" />
      <path d="m7.5 8 4.5-4.5L16.5 8" />
      <path d="M4.5 15v3.6A1.9 1.9 0 0 0 6.4 20.5h11.2a1.9 1.9 0 0 0 1.9-1.9V15" />
    </symbol>

    <!-- 겨울 모자(비니) 아이콘 — 참고 시안 근사, 자체 제작 -->
    <symbol id="ico-beanie" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 14.2c0-4.6 3.4-8.4 7.5-8.4s7.5 3.8 7.5 8.4" />
      <path d="M3.6 14.2h16.8a1 1 0 0 1 1 1v.6a1 1 0 0 1-1 1H3.6a1 1 0 0 1-1-1v-.6a1 1 0 0 1 1-1Z" />
      <path d="M12 2.4v2.3" />
      <circle cx="12" cy="2" r=".9" fill="currentColor" stroke="none" />
    </symbol>

    <!-- 옷걸이 아이콘 -->
    <symbol id="ico-hanger" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2a1.6 1.6 0 1 1 1.6 1.6" />
      <path d="M12 4.8v2.4" />
      <path d="M12 7.2 3.4 13a2 2 0 0 0 1.1 3.6h15a2 2 0 0 0 1.1-3.6L12 7.2Z" />
      <path d="M5 19.8h14" />
    </symbol>

    <!-- 360도 뷰 큐브 아이콘 -->
    <symbol id="ico-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.4 20 8v8l-8 4.6L4 16V8l8-4.6Z" />
      <path d="M4 8l8 4.6L20 8" />
      <path d="M12 12.6v8" />
    </symbol>

    <symbol id="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14" />
    </symbol>
  </svg>

  <!-- ── 페이지 ───────────────────────────────────────────────── -->
  <main class="page">
    <header class="page__head">
      <p class="page__eyebrow" data-bind="eyebrow"></p>
      <h1 class="page__title" data-bind="title"></h1>
      <p class="page__subtitle" data-bind="subtitle"></p>
    </header>

    <section class="gallery" id="productGallery" aria-label="상품 카드 목록">
      <div class="gallery__track" id="productTrack"></div>
    </section>
  </main>

  <!-- 알림 토스트 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ── 템플릿 ───────────────────────────────────────────────── -->

  <template id="productCardTemplate">
    <article class="card">
      <!-- 상단 컨트롤: 뒤로가기 / 찜하기 / 공유 -->
      <div class="card__topbar">
        <button type="button" class="iconbtn card__back" aria-label="뒤로가기">
          <svg class="iconbtn__icon" aria-hidden="true"><use href="#ico-chevron-left" /></svg>
        </button>
        <div class="card__topbar-end">
          <button type="button" class="iconbtn card__wish" aria-label="찜 목록에 추가" aria-pressed="false">
            <svg class="iconbtn__icon" aria-hidden="true"><use href="#ico-heart" /></svg>
          </button>
          <button type="button" class="iconbtn card__share" aria-label="상품 공유하기">
            <svg class="iconbtn__icon" aria-hidden="true"><use href="#ico-upload" /></svg>
          </button>
        </div>
      </div>

      <!-- 상품 이미지 + 캐러셀 -->
      <div class="card__stage">
        <span class="card__orbit" aria-hidden="true"></span>
        <div class="card__swiper swiper">
          <div class="swiper-wrapper"></div>
        </div>
        <div class="card__photo-nav">
          <button type="button" class="card__photo-btn card__photo-prev" aria-label="이전 이미지">
            <svg class="card__photo-icon" aria-hidden="true"><use href="#ico-chevron-left" /></svg>
          </button>
          <button type="button" class="card__photo-btn card__photo-next" aria-label="다음 이미지">
            <svg class="card__photo-icon" aria-hidden="true"><use href="#ico-chevron-right" /></svg>
          </button>
        </div>
      </div>

      <!-- 배지 + 카테고리 아이콘 -->
      <div class="card__meta-row">
        <span class="badge card__badge"></span>
        <svg class="card__category-icon" aria-hidden="true"><use /></svg>
      </div>

      <!-- 제목 / 브랜드 / 가격 -->
      <div class="card__info-row">
        <div class="card__identity">
          <h2 class="card__title"></h2>
          <p class="card__brand">
            <span class="card__brand-avatar"></span>
            <span class="card__brand-name"></span>
          </p>
        </div>
        <div class="card__price">
          <span class="card__price-original"></span>
          <span class="card__price-discounted"></span>
        </div>
      </div>

      <!-- 하단 액션 -->
      <div class="card__actions">
        <button type="button" class="pillbtn card__size" aria-haspopup="listbox" aria-expanded="false">
          <span class="card__size-label">Choose size</span>
          <svg class="pillbtn__icon" aria-hidden="true"><use href="#ico-chevron-down" /></svg>
        </button>
        <button type="button" class="iconbtn iconbtn--outline card__view3d" aria-label="360도 보기">
          <svg class="iconbtn__icon" aria-hidden="true"><use href="#ico-cube" /></svg>
        </button>
        <button type="button" class="pillbtn pillbtn--primary card__add">
          <svg class="pillbtn__icon" aria-hidden="true"><use href="#ico-plus" /></svg>
          <span>Add to Cart</span>
        </button>

        <ul class="sizemenu card__sizemenu" role="listbox" aria-label="사이즈 선택" hidden></ul>
      </div>
    </article>
  </template>

  <template id="sizeOptionTemplate">
    <li class="sizemenu__option" role="option" aria-selected="false"></li>
  </template>

  <template id="photoSlideTemplate">
    <div class="swiper-slide card__slide">
      <img class="card__photo" alt="" draggable="false" />
      <div class="card__photo-fallback" aria-hidden="true"></div>
    </div>
  </template>

  <script src="./js/swiper.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
