<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Name Card — 모바일 명함</title>
  <meta name="description" content="JSON 하나로 관리하는 모바일 디지털 명함 컴포넌트" />

  <!-- 웹폰트 (외부 리소스는 폰트만 허용) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />

  <link rel="stylesheet" href="./css/swiper.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 배경 장식 -->
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-decor__blob bg-decor__blob--a"></span>
    <span class="bg-decor__blob bg-decor__blob--b"></span>
  </div>

  <!-- ── 아이콘 스프라이트 ─────────────────────────────────────── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ico-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.4 3.5h3.1l1.5 3.9-2 1.4a12.4 12.4 0 0 0 6.2 6.2l1.4-2 3.9 1.5v3.1a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.4 5.7a2 2 0 0 1 2-2.2Z" />
    </symbol>

    <symbol id="ico-message" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.2 11.6c0 3.6-3.5 6.5-7.9 6.5a9.9 9.9 0 0 1-2.7-.4L5 19.4l1.4-3.3a6 6 0 0 1-2.6-4.5c0-3.6 3.6-6.5 8-6.5s8.4 2.9 8.4 6.5Z" />
    </symbol>

    <symbol id="ico-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.2" y="5.4" width="17.6" height="13.2" rx="2.4" />
      <path d="m3.8 7.4 7.2 5.1a1.8 1.8 0 0 0 2 0l7.2-5.1" />
    </symbol>

    <symbol id="ico-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.6" />
      <path d="M3.4 12h17.2" />
      <path d="M12 3.4c2.2 2.3 3.4 5.4 3.4 8.6S14.2 18.3 12 20.6c-2.2-2.3-3.4-5.4-3.4-8.6S9.8 5.7 12 3.4Z" />
    </symbol>

    <symbol id="ico-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21.2c4.4-4.4 6.6-7.8 6.6-10.4a6.6 6.6 0 1 0-13.2 0c0 2.6 2.2 6 6.6 10.4Z" />
      <circle cx="12" cy="10.4" r="2.5" />
    </symbol>

    <symbol id="ico-link" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.3 13.7a4 4 0 0 0 5.7 0l2.9-2.9a4 4 0 0 0-5.7-5.7l-1.4 1.4" />
      <path d="M13.7 10.3a4 4 0 0 0-5.7 0l-2.9 2.9a4 4 0 0 0 5.7 5.7l1.4-1.4" />
    </symbol>

    <symbol id="ico-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9.5 5.5 6.5 6.5-6.5 6.5" />
    </symbol>

    <!-- 카카오톡은 브랜드 색을 유지해야 하므로 채움 도형으로 그린다 -->
    <symbol id="ico-kakao" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="7" fill="#FEE500" />
      <path fill="#3C1E1E"
        d="M12 5.2c-3.9 0-7 2.4-7 5.4 0 1.9 1.3 3.6 3.2 4.6l-.8 3 3.4-2.2c.4.05.8.08 1.2.08 3.9 0 7-2.4 7-5.4S15.9 5.2 12 5.2Z" />
    </symbol>
  </svg>

  <!-- ── 페이지 ───────────────────────────────────────────────── -->
  <main class="page">
    <header class="page__head">
      <p class="page__eyebrow" data-bind="eyebrow"></p>
      <h1 class="page__title" data-bind="title"></h1>
      <p class="page__subtitle" data-bind="subtitle"></p>
    </header>

    <!-- 슬라이더 컨트롤 — 서브타이틀 아래. 조작 대상은 아래 #cardGallery 다 -->
    <div class="gallery__controls gallery__controls--top">
      <button type="button" class="gallery__nav gallery__nav--prev" id="cardPrev"
        aria-label="이전 명함" aria-controls="cardGallery">
        <svg class="gallery__nav-icon" aria-hidden="true"><use href="#ico-chevron" /></svg>
      </button>
      <div class="gallery__pagination" id="cardPagination"></div>
      <button type="button" class="gallery__nav gallery__nav--next" id="cardNext"
        aria-label="다음 명함" aria-controls="cardGallery">
        <svg class="gallery__nav-icon" aria-hidden="true"><use href="#ico-chevron" /></svg>
      </button>
    </div>

    <!-- 명함 슬라이더 — 카드는 .swiper-wrapper 안에 렌더링됩니다 -->
    <section class="gallery-shell" aria-label="디지털 명함 목록">
      <div class="gallery swiper" id="cardGallery">
        <div class="swiper-wrapper" id="cardTrack"></div>
      </div>

      <p class="gallery__message" id="galleryMessage"></p>
    </section>
  </main>

  <!-- 복사 알림 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ── 템플릿 ───────────────────────────────────────────────── -->

  <!-- 카드 셸 -->
  <template id="cardTemplate">
    <article class="namecard">
      <div class="namecard__scroll">
        <div class="namecard__frame">
          <div class="namecard__hero">
            <div class="namecard__photo"></div>
            <div class="namecard__glass"></div>
          </div>
        </div>
        <div class="namecard__body">
          <ul class="namecard__contacts"></ul>
          <ul class="namecard__links"></ul>
          <section class="namecard__about">
            <h3 class="namecard__about-title"></h3>
            <div class="namecard__about-body"></div>
          </section>
        </div>
        <p class="namecard__slogan"></p>
      </div>
    </article>
  </template>

  <!-- 아이덴티티: 아바타 + 이름/직무/회사 + 로고 -->
  <template id="identityTemplate">
    <header class="identity">
      <div class="identity__avatar"></div>
      <div class="identity__text">
        <h2 class="identity__name"></h2>
        <p class="identity__role"></p>
        <p class="identity__company"></p>
      </div>
      <div class="identity__logo">
        <span class="identity__logo-mark"></span>
        <span class="identity__logo-text">
          <b class="identity__logo-name"></b>
          <i class="identity__logo-sub"></i>
        </span>
      </div>
    </header>
  </template>

  <!-- 태그 칩 -->
  <template id="tagTemplate">
    <li class="chip"></li>
  </template>

  <!-- 부서/직책 메타 (blue 테마) -->
  <template id="metaTemplate">
    <div class="meta__cell">
      <dt class="meta__label"></dt>
      <dd class="meta__value"></dd>
    </div>
  </template>

  <!-- 연락처 — row 형(dark / paper / navy) -->
  <template id="contactRowTemplate">
    <li class="contact contact--row">
      <a class="contact__link">
        <span class="contact__label"></span>
        <span class="contact__value"></span>
        <svg class="contact__chevron" aria-hidden="true"><use href="#ico-chevron" /></svg>
      </a>
    </li>
  </template>

  <!-- 연락처 — stack 형(light / blue) -->
  <template id="contactStackTemplate">
    <li class="contact contact--stack">
      <span class="contact__text">
        <span class="contact__label"></span>
        <button type="button" class="contact__value contact__value--copy"></button>
      </span>
      <span class="contact__actions"></span>
    </li>
  </template>

  <!-- 액션 아이콘 버튼 -->
  <template id="actionTemplate">
    <a class="action">
      <svg class="action__icon" aria-hidden="true"><use /></svg>
    </a>
  </template>

  <!-- 링크 행 -->
  <template id="linkTemplate">
    <li class="linkrow">
      <a class="linkrow__link">
        <svg class="linkrow__icon" aria-hidden="true"><use /></svg>
        <span class="linkrow__label"></span>
        <svg class="linkrow__chevron" aria-hidden="true"><use href="#ico-chevron" /></svg>
      </a>
    </li>
  </template>

  <script src="./js/swiper.js"></script>
  <script src="./js/avatar.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
