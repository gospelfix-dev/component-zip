<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Name Card — 미리보기</title>
  <style>
    /* card.html 을 PC / 모바일 틀 안에 띄워 보는 미리보기 셸.
       iframe 의 폭이 곧 뷰포트라서 모바일 틀에서는 ≤580px 레이아웃이 그대로 적용된다. */
    :root {
      --bg: #eef1f8;
      --ink: #16181d;
      --ink-soft: #6b7280;
      --frame: #f7f8fa;
      --frame-line: rgba(20, 30, 60, 0.12);
      --bezel: #15171c;
      --accent: #e8502e;
      --shadow: 0 30px 70px -30px rgba(20, 30, 60, 0.5), 0 4px 14px -4px rgba(20, 30, 60, 0.15);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px 16px 40px;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    /* 기기 전환 토글 */
    .switch {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 0 1px var(--frame-line);
    }

    .switch__btn {
      display: grid;
      place-items: center;
      width: 54px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background-color 0.25s var(--ease), color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .switch__btn svg { width: 22px; height: 22px; }

    .switch__btn[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 4px 12px -6px rgba(20, 30, 60, 0.5);
    }

    .switch__btn:focus-visible { outline: 2px solid #1a50d8; outline-offset: 2px; }

    /* 틀 밖 머리글 — card.html 의 .page__head 와 같은 모양 */
    .head { text-align: center; }
    .head__eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-soft); }
    .head__title { margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
    .head__subtitle { margin: 8px 0 0; font-size: clamp(13px, 1.4vw, 15px); color: var(--ink-soft); }

    /* 틀 밖 컨트롤 — 이전/다음 + 페이지네이션 */
    .controls { display: flex; align-items: center; justify-content: center; gap: 14px; }

    .controls__nav {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(20, 30, 60, 0.12);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 6px 16px -10px rgba(20, 30, 60, 0.5);
      transition: transform 0.25s var(--ease), opacity 0.25s var(--ease);
    }

    .controls__nav svg { width: 18px; height: 18px; }
    .controls__nav--prev svg { transform: rotate(180deg); }
    .controls__nav:hover:not(:disabled) { transform: translateY(-2px); }
    .controls__nav:disabled { opacity: 0.32; cursor: default; }
    .controls__nav:focus-visible, .controls__dot:focus-visible { outline: 2px solid #1a50d8; outline-offset: 2px; }

    .controls__dots { display: flex; align-items: center; gap: 8px; }

    .controls__dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: rgba(20, 30, 60, 0.2);
      cursor: pointer;
      transition: width 0.3s var(--ease), background-color 0.3s var(--ease);
    }

    .controls__dot[aria-current="true"] { width: 24px; background: var(--ink); }

    .stage { width: 100%; display: flex; justify-content: center; }

    /* ---------- PC : 브라우저 창 ---------- */
    .browser {
      width: min(1180px, 100%);
      /* 카드 한 장이 통째로 보이도록 화면보다 크게 잡는다 — 모자라면 페이지가 스크롤된다 */
      height: clamp(880px, calc(100vh - 80px), 980px);
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      background: var(--frame);
      box-shadow: var(--shadow), 0 0 0 1px var(--frame-line);
      overflow: hidden;
    }

    .browser__bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 18px;
      border-bottom: 1px solid var(--frame-line);
      background: #fff;
    }

    .browser__dot { width: 12px; height: 12px; border-radius: 50%; background: #d9dce3; }

    /* ---------- 모바일 : 휴대폰 ---------- */
    .phone {
      width: 430px;
      max-width: 100%;
      /* 높이는 카드 높이를 따라간다 — 스크롤은 바깥 페이지 하나뿐이다 */
      height: auto;
      padding: 14px;
      border-radius: 54px;
      background: var(--bezel);
      box-shadow: var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .phone__screen {
      position: relative;
      padding-top: 0; /* 카드가 화면 맨 위까지 채운다 */
      border-radius: 42px;
      background: #fbfcfe;
      overflow: hidden;
    }

    .phone .frame-view { height: 640px; } /* 카드 높이를 받기 전 임시값 — 이후 부모 스크립트가 덮어쓴다 */
    .frame-view { flex: 1; display: block; width: 100%; height: 100%; border: 0; background: #fff; }

    [hidden] { display: none !important; }

    /* 좁은 화면 — PC 틀은 의미가 없어 토글을 숨기고, 폰 틀은 유지하되 베젤만 얇게 줄인다 */
    @media (max-width: 640px) {
      body { padding: 16px 12px 32px; gap: 16px; }
      .switch { display: none; }
      .phone { padding: 10px; border-radius: 44px; }
      .phone__screen { border-radius: 34px; }
    }
  </style>
</head>
<body>
  <div class="switch" role="group" aria-label="미리보기 기기 선택">
    <button class="switch__btn" type="button" data-device="pc" aria-pressed="true" aria-label="PC 화면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
      </svg>
    </button>
    <button class="switch__btn" type="button" data-device="mobile" aria-pressed="false" aria-label="모바일 화면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>
      </svg>
    </button>
  </div>

  <header class="head">
    <p class="head__eyebrow" id="headEyebrow"></p>
    <h1 class="head__title" id="headTitle">&nbsp;</h1>
    <p class="head__subtitle" id="headSubtitle"></p>
  </header>

  <div class="controls" id="controls">
    <button class="controls__nav controls__nav--prev" type="button" id="goPrev" aria-label="이전 명함" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="controls__dots" id="dots"></div>
    <button class="controls__nav controls__nav--next" type="button" id="goNext" aria-label="다음 명함" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>

  <main class="stage">
    <section class="browser" id="viewPc" aria-label="PC 미리보기">
      <div class="browser__bar" aria-hidden="true">
        <span class="browser__dot"></span><span class="browser__dot"></span><span class="browser__dot"></span>
      </div>
      <iframe class="frame-view" title="디지털 명함 — PC 화면" data-src="./card.html?embed=1"></iframe>
    </section>

    <section class="phone" id="viewMobile" aria-label="모바일 미리보기" hidden>
      <div class="phone__screen">
        <iframe class="frame-view" title="디지털 명함 — 모바일 화면" data-src="./card.html?embed=1"></iframe>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const views = { pc: document.getElementById("viewPc"), mobile: document.getElementById("viewMobile") };
      const buttons = document.querySelectorAll(".switch__btn");
      const $ = (id) => document.getElementById(id);
      let active = "pc";

      const activeFrame = () => views[active].querySelector("iframe");
      const send = (msg) => { const w = activeFrame().contentWindow; if (w) w.postMessage(msg, "*"); };

      // iframe 은 처음 보여질 때 한 번만 읽는다
      const show = (device) => {
        active = device;
        Object.entries(views).forEach(([key, el]) => {
          el.hidden = key !== device;
          const frame = el.querySelector("iframe");
          if (key === device) {
            if (!frame.src) frame.src = frame.dataset.src;
            else send({ type: "namecard:hello" }); // 이미 떠 있는 쪽은 현재 상태를 다시 받는다
          }
        });
        buttons.forEach((btn) => btn.setAttribute("aria-pressed", String(btn.dataset.device === device)));
        try { localStorage.setItem("namecard-preview-device", device); } catch (e) { /* 저장 불가 환경은 건너뛴다 */ }
      };

      buttons.forEach((btn) => btn.addEventListener("click", () => show(btn.dataset.device)));

      // 틀 안의 명함 페이지가 알려 주는 상태로 머리글·컨트롤을 그린다
      const render = (state) => {
        const sec = state.section || {};
        $("headEyebrow").textContent = sec.eyebrow || "";
        $("headTitle").textContent = sec.title || "";
        $("headSubtitle").textContent = sec.subtitle || "";

        $("goPrev").disabled = state.isBeginning;
        $("goNext").disabled = state.isEnd;

        const dots = $("dots");
        if (dots.children.length !== state.count) {
          dots.textContent = "";
          for (let i = 0; i < state.count; i++) {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = "controls__dot";
            dot.setAttribute("aria-label", (i + 1) + "번째 명함으로 이동");
            dot.addEventListener("click", () => send({ type: "namecard:go", to: i }));
            dots.appendChild(dot);
          }
        }
        [...dots.children].forEach((dot, i) => {
          if (i === state.index) dot.setAttribute("aria-current", "true");
          else dot.removeAttribute("aria-current");
        });
      };

      window.addEventListener("message", (event) => {
        const msg = event.data || {};
        // 지금 보이는 틀에서 온 메시지만 받는다
        if (msg.type !== "namecard:state" || event.source !== activeFrame().contentWindow) return;
        render(msg);
        if (active === "mobile" && msg.height) activeFrame().style.height = msg.height + "px";
      });

      $("goPrev").addEventListener("click", () => send({ type: "namecard:go", to: "prev" }));
      $("goNext").addEventListener("click", () => send({ type: "namecard:go", to: "next" }));

      let saved = "pc";
      try { saved = localStorage.getItem("namecard-preview-device") === "mobile" ? "mobile" : "pc"; } catch (e) { /* 기본값 사용 */ }
      if (window.matchMedia("(max-width: 640px)").matches) saved = "mobile";
      show(saved);
    })();
  </script>
</body>
</html>
