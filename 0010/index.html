<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII 3D 크리스마스 트리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <canvas id="tree" role="img" aria-label="천천히 회전하는 3D ASCII 크리스마스 트리. 층마다 가지가 떨어져 쌓인 뒤 장식, 전구, 별, 선물이 차례로 나타납니다."></canvas>
  <div class="bar">
    <span class="file">tree3d.js</span>
    <span id="rotation">rotation 0.0°</span>
    <span id="letters">letters 0</span>
    <span class="spacer"></span>
    <span>드래그로 회전</span>
    <span><span id="dot" class="dot building"></span><span id="status">building · ground</span></span>
    <button id="replay" type="button">다시 쌓기 (R)</button>
  </div>
  <section class="player" id="player" aria-label="배경음악 플레이어">
    <div class="player-head">
      <div class="player-meta">
        <p class="player-title" id="songTitle">Christmas Jazz</p>
        <p class="player-artist" id="songArtist">Tunetank · Pixabay</p>
      </div>
      <button class="icon-btn more" id="more" type="button" aria-label="플레이어 메뉴" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button type="button" role="menuitem" id="switchSource">오르골 캐롤로 바꾸기</button>
        <button type="button" role="menuitem" id="fold">플레이어 접기</button>
      </div>
    </div>
    <div class="player-time"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
    <div class="player-controls">
      <button class="icon-btn like" id="like" type="button" aria-label="좋아요" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.4-4.5-9.2-9.1C1.6 8.1 3.5 4.6 7 4.6c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.5 0 5.4 3.5 4.2 6.6-1.8 4.6-9.2 9.1-9.2 9.1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="prev" type="button" aria-label="10초 뒤로">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.2 6.6v10.8a1 1 0 0 1-1.6.8L2.9 13a1.2 1.2 0 0 1 0-2l6.7-5.2a1 1 0 0 1 1.6.8zm10 0v10.8a1 1 0 0 1-1.6.8L12.9 13a1.2 1.2 0 0 1 0-2l6.7-5.2a1 1 0 0 1 1.6.8z"/></svg>
      </button>
      <button class="icon-btn play" id="music" type="button" aria-label="재생 (M)" aria-pressed="false">
        <svg class="when-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.2 4.9v14.2a1.3 1.3 0 0 0 2 1.1l11-7.1a1.3 1.3 0 0 0 0-2.2l-11-7.1a1.3 1.3 0 0 0-2 1.1z"/></svg>
        <svg class="when-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.8" y="4.5" width="4.4" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.4" height="15" rx="1.3"/></svg>
      </button>
      <button class="icon-btn" id="next" type="button" aria-label="10초 앞으로">
        <svg class="flip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.2 6.6v10.8a1 1 0 0 1-1.6.8L2.9 13a1.2 1.2 0 0 1 0-2l6.7-5.2a1 1 0 0 1 1.6.8zm10 0v10.8a1 1 0 0 1-1.6.8L12.9 13a1.2 1.2 0 0 1 0-2l6.7-5.2a1 1 0 0 1 1.6.8z"/></svg>
      </button>
      <button class="icon-btn volume" id="volume" type="button" aria-label="음소거" aria-pressed="false">
        <svg class="when-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.3h3.2L12 5.4v13.2l-4.8-3.9H4a.9.9 0 0 1-.9-.9V10.2a.9.9 0 0 1 .9-.9z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
        <svg class="when-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.3h3.2L12 5.4v13.2l-4.8-3.9H4a.9.9 0 0 1-.9-.9V10.2a.9.9 0 0 1 .9-.9z"/><path d="M16 9.5l5 5m0-5l-5 5"/></svg>
      </button>
    </div>
  </section>
  <button class="player-pill" id="unfold" type="button" aria-label="플레이어 펼치기" hidden>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="pillTitle">Christmas Jazz</span>
  </button>
  <div id="notice" class="notice" hidden>창이 너무 작습니다. 창을 조금 키워 주세요.</div>
</div>

<script src="script.js"></script>
</body>
</html>
