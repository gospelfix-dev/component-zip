<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette Series — Ice Cream Cards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Poppins:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 배경 장식: 핑크 꽃 -->
  <div class="bg-decor" aria-hidden="true">
    <svg class="flower flower--left" viewBox="0 0 200 200">
      <use href="#flower-shape" />
    </svg>
    <svg class="flower flower--right" viewBox="0 0 200 200">
      <use href="#flower-shape" />
    </svg>
  </div>

  <!-- 재사용 SVG 심볼 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower-shape" viewBox="0 0 200 200">
      <g fill="currentColor">
        <ellipse cx="100" cy="45" rx="26" ry="45" />
        <ellipse cx="100" cy="155" rx="26" ry="45" />
        <ellipse cx="45" cy="100" rx="45" ry="26" />
        <ellipse cx="155" cy="100" rx="45" ry="26" />
        <ellipse cx="61" cy="61" rx="26" ry="45" transform="rotate(-45 61 61)" />
        <ellipse cx="139" cy="61" rx="26" ry="45" transform="rotate(45 139 61)" />
        <ellipse cx="61" cy="139" rx="26" ry="45" transform="rotate(45 61 139)" />
        <ellipse cx="139" cy="139" rx="26" ry="45" transform="rotate(-45 139 139)" />
      </g>
    </symbol>
  </svg>

  <main class="page">
    <header class="page__head">
      <p class="page__eyebrow" data-bind="eyebrow"></p>
      <h1 class="page__title" data-bind="title"></h1>
      <p class="page__subtitle" data-bind="subtitle"></p>
    </header>

    <!-- 카드가 여기에 렌더링됩니다 -->
    <section class="palette-grid" id="paletteGrid" aria-label="Flavor cards"></section>
  </main>

  <!-- 카드 템플릿 -->
  <template id="paletteCardTemplate">
    <article class="palette-card">
      <div class="palette-card__head">
        <h2 class="palette-card__title">
          <span class="palette-card__name"></span>
          <span class="palette-card__script"></span>
        </h2>
        <p class="palette-card__desc"></p>
      </div>
      <div class="palette-card__media"></div>
    </article>
  </template>

  <script src="./js/popsicle.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
