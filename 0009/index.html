<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연두 — 과하지 않은, 나에게 맞는 변화</title>
  <meta name="description" content="연두는 피부 본연의 리듬을 살피는 차분한 뷰티샵입니다." />
  <link rel="stylesheet" href="assets/css/init.css" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <main id="main">
    <section class="hero" id="hero">
      <header class="site-header" id="siteHeader">
        <div class="header-inner container">
          <a class="brand-mark" href="#hero" data-target="#hero" id="brandWordmark">yeondu</a>

          <nav class="main-nav" id="mainNav">
            <ul class="nav-list" id="navList"></ul>
          </nav>

          <div class="header-actions">
            <button type="button" class="btn btn-primary btn-sm" data-target="#pricing">예약하기</button>
            <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mainNav">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="hero-content container">
        <h1 class="reveal" id="heroHeadline"></h1>
        <p class="reveal" id="heroDesc"></p>
        <div class="hero-actions reveal">
          <button type="button" class="btn btn-primary" id="heroPrimaryBtn" data-target="#pricing"></button>
          <button type="button" class="btn btn-secondary" id="heroSecondaryBtn" data-target="#menu"></button>
        </div>
      </div>
    </section>

    <section class="menu-section" id="menu">
      <div class="container">
        <h2 class="section-title reveal">시그니처 메뉴</h2>
        <div class="menu-tabs reveal" id="menuTabs"></div>
        <ul class="menu-list" id="menuList"></ul>
      </div>
    </section>

    <section class="before-after-section" id="before-after">
      <div class="container">
        <h2 class="section-title reveal">전후 사진</h2>
        <div class="before-after-grid" id="beforeAfterGrid"></div>
      </div>
    </section>

    <section class="team-section" id="team">
      <div class="container">
        <p class="about-lead reveal" id="aboutLead"></p>
        <p class="about-body reveal" id="aboutBody"></p>
        <div class="team-grid" id="teamGrid"></div>
      </div>
    </section>

    <section class="reviews-section" id="reviews">
      <div class="container">
        <h2 class="section-title reveal">실제 후기</h2>
        <div class="review-grid" id="reviewGrid"></div>
      </div>
    </section>

    <section class="pricing-section" id="pricing">
      <div class="container">
        <h2 class="section-title reveal">가격·위치·영업시간</h2>
        <div class="pricing-layout">
          <div class="pricing-info reveal">
            <table class="price-table">
              <tbody id="priceTableBody"></tbody>
            </table>
            <dl class="info-list" id="infoList"></dl>
          </div>

          <form class="reservation-form reveal" id="reservationForm" novalidate>
            <h3>예약 문의</h3>

            <div class="form-row">
              <label for="resName">이름</label>
              <input id="resName" name="name" type="text" required autocomplete="name" />
            </div>

            <div class="form-row">
              <label for="resPhone">연락처</label>
              <input id="resPhone" name="phone" type="tel" required autocomplete="tel" />
            </div>

            <div class="form-row">
              <label for="resDate">희망일</label>
              <input id="resDate" name="date" type="date" />
            </div>

            <div class="form-row">
              <label for="resMessage">메시지</label>
              <textarea id="resMessage" name="message" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">문의 보내기</button>
            <p class="form-result" id="formResult" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" id="footerWordmark"></span>
        <p class="footer-tagline" id="footerTagline"></p>
        <div class="footer-social" id="footerSocial"></div>
      </div>

      <div class="footer-links">
        <div class="footer-col">
          <h4>About</h4>
          <ul id="footerAbout"></ul>
        </div>
        <div class="footer-col">
          <h4>Info</h4>
          <ul id="footerInfo"></ul>
        </div>
        <div class="footer-col">
          <h4>Other</h4>
          <ul id="footerOther"></ul>
        </div>
      </div>
    </div>

    <div class="container">
      <p class="footer-legal" id="footerLegal"></p>
    </div>
  </footer>

  <div class="sticky-bar" id="stickyBar">
    <button type="button" class="btn btn-primary" id="stickyPrimaryBtn" data-target="#pricing">예약하기</button>
    <button type="button" class="btn btn-secondary" id="stickySecondaryBtn" data-target="#pricing">문의</button>
  </div>

  <button type="button" class="chat-fab" id="chatFab" aria-label="빠른 문의 열기" aria-expanded="false" aria-controls="chatPanel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
    </svg>
  </button>

  <div class="chat-panel" id="chatPanel" hidden>
    <div class="chat-panel-header">
      <div>
        <p class="chat-panel-title" id="chatPanelTitle"></p>
        <p class="chat-panel-subtitle" id="chatPanelSubtitle"></p>
      </div>
      <button type="button" class="chat-close-btn" id="chatCloseBtn" aria-label="닫기">&times;</button>
    </div>
    <div class="chat-body">
      <div class="chat-greeting" id="chatGreeting"></div>
      <div class="chat-topics" id="chatTopics"></div>
      <div class="chat-answer" id="chatAnswer" hidden></div>
    </div>
  </div>

  <p class="fetch-error" id="fetchError" hidden></p>

  <!-- 2026-10-16 외부 CDN 금지 규칙의 명시적 예외(사용자 확정) — motion.dev(Motion) -->
  <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
  <script src="assets/js/script.js" defer></script>
</body>
</html>
